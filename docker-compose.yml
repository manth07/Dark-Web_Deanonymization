services:
  neo4j:
    image: neo4j:5.20-community
    container_name: deanon-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/ThreatIntelSecurePass2026}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-ThreatIntelSecurePass2026} 'RETURN 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: deanon-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ai-graph:
    build:
      context: ./ai-graph
      dockerfile: Dockerfile
    container_name: deanon-ai-graph
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./ai-graph:/app
    stdin_open: true
    tty: true

volumes:
  neo4j_data:
  ollama_models:
